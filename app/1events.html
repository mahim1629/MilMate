.dh{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}

function sunPos(jd){
  const T=(jd-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T, M=357.52911+35999.05029*T-0.0001537*T*T, e=0.016708634-0.000042037*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*sn(M)+(0.019993-0.000101*T)*sn(2*M)+0.000289*sn(3*M);
  const om=125.04-1934.136*T, lon=nrm(L0+C-0.00569-0.00478*sn(om)), nu=M+C;
  const dist=1.000001018*(1-e*e)/(1+e*cs(nu));

}
function eq(lon,lat,eps){
  const ra=nrm(Math.atan2(sn(lon)*cs(eps)-Math.tan(lat*R)*sn(eps),cs(lon))/R);

  return {ra,dec};
}
function moonPos(jd){

        M=nrm(357.5291092+35999.0502909*T-0.0001536*T*T), Mp=nrm(134.9633964+477198.8675055*T+0.0087414*T*T),
        F=nrm(93.2720950+483202.0175233*T-0.0036539*T*T), E=1-0.002516*T-0.0000074*T*T;
  const A1=119.75+131.849*T, A2=53.09+479264.290*T, A3=313.45+481266.484*T;
  let sl=0,sr=0,sb=0;
  for(const [d,m,mp,f,l,r] of TL){const ef=Math.abs(m)===1?E:Math.abs(m)===2?E*E:1;const a=d*D+m*M+mp*Mp+f*F;sl+=l*ef*sn(a);sr+=r*ef*cs(a)}

  sb+=-2235*sn(Lp)+382*sn(A3)+175*sn(A1-F)+175*sn(A1+F)+127*sn(Lp-Mp)-115*sn(Lp+Mp);
  const om=125.04452-1934.136261*T, Ls=280.4665+36000.7698*T;

const gmst=jd=>{const T=(jd-2451545)/36525;return nrm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T)};
const altOf=(p,jd,lat,lon)=>{const H=gmst(jd)+lon-p.ra;return Math.asin(sn(lat)*sn(p.dec)+cs(lat)*cs(p.dec)*cs(H))/R};

const sunAlt=(jd,lat,lon)=>altOf(sunPos(jd),jd,lat,lon);
const moonH0=jd=>{const hp=Math.asin(6378.14/moonPos(jd).dist)/R;return 0.7275*hp-0.5667};
// crossings of f(jd)=th inside [a,b]
function cross(f,th,a,b,step=1/288){
  const out=[];let t0=a,v0=f(t0)-th;
  for(let t=a+step;t<=b+1e-9;t+=step){
    const v1=f(t)-th;
    if((v0<0)!==(v1<0)){let lo=t-step,hi=t,vl=v0;
      for(let i=0;i<24;i++){const mid=(lo+hi)/2,vm=f(mid)-th;if((vm<0)===(vl<0)){lo=mid;vl=vm}else hi=mid}

  }
  return out;
}
function phaseAt(jd){
  const m=moonPos(jd),s=sunPos(jd);
  const elong=nrm(m.lon-s.lon), cosPsi=cs(m.lat)*cs(m.lon-s.lon), psi=Math.acos(cosPsi)/R;

  return {elong,illum:(1+cs(i))/2*100,age:elong/360*29.530588};

function phaseName(e){
  const n=[["New Moon",0],["Waxing Crescent",45],["First Quarter",90],["Waxing Gibbous",135],["Full Moon",180],["Waning Gibbous",225],["Last Quarter",270],["Waning Crescent",315]];
  let best=n[0],bd=999;for(const x of n){const d=Math.min(Math.abs(e-x[1]),360-Math.abs(e-x[1]));if(d<bd){bd=d;best=x}}
  return bd<=6?best[0]:(e<90?"Waxing Crescent":e<180?"Waxing Gibbous":e<270?"Waning Gibbous":"Waning Crescent");

// Name of the moon for a whole local day: a principal phase (new, first quarter, full, last quarter) is named on the day it happens
const softName=e=>e<90?"Waxing Crescent":e<180?"Waxing Gibbous":e<270?"Waning Gibbous":"Waning Crescent";
function dayPhase(jd0){
  const el=j=>nrm(moonPos(j).lon-sunPos(j).lon), a=el(jd0), b=el(jd0+1), qa=Math.floor(a/90), qb=Math.floor(b/90);

    const tg=((qa+1)%4)*90, g=j=>nrm(el(j)-tg+180)-180;
    let lo=jd0,hi=jd0+1;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(g(mid)>=0)hi=mid;else lo=mid}
    return {name:["New Moon","First Quarter","Full Moon","Last Quarter"][(qa+1)%4],jd:(lo+hi)/2};
  }
  return {name:softName(el(jd0+0.5)),jd:null};
}
// Quarter = 1st (new->first quarter), 2nd (->full), 3rd (->last quarter), 4th (->new). Day 1 = calendar date on which the quarter began.
function quarterDay(jd0,tz){
  const jm=jd0+1, el=j=>nrm(moonPos(j).lon-sunPos(j).lon), q=Math.floor(el(jm)/90), tg=q*90;
  const g=j=>nrm(el(j)-tg+180)-180;
  let lo=jm-9,hi=jm;for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(g(mid)>=0)hi=mid;else lo=mid}
  const dn=j=>Math.floor(j+tz/24+0.5+1e-6);
  return {q:q+1,day:dn(jd0)-dn(hi)+1};
}
function compute(y,mo,d,lat,lon,tz=6){
  const jd0=Date.UTC(y,mo-1,d)/864e5+2440587.5-tz/24;
  const out={};
  const mr=cross(j=>moonAlt(j,lat,lon)-moonH0(j),0,jd0,jd0+1);
  out.moonrise=mr.filter(e=>e.rising).map(e=>e.jd);out.moonset=mr.filter(e=>!e.rising).map(e=>e.jd);
  const sr=cross(j=>sunAlt(j,lat,lon),-0.833,jd0,jd0+1);
  out.sunrise=(sr.find(e=>e.rising)||{}).jd;out.sunset=(sr.find(e=>!e.rising)||{}).jd;
  const nt=cross(j=>sunAlt(j,lat,lon),-12,jd0,jd0+1);
  out.bmnt=(nt.find(e=>e.rising)||{}).jd;out.eent=(nt.find(e=>!e.rising)||{}).jd;
  // moonlight during the night: EENT (this evening) to BMNT (next morning)
  const nt2=cross(j=>sunAlt(j,lat,lon),-12,jd0+1,jd0+2);
  const bm2=(nt2.find(e=>e.rising)||{}).jd;
  out.nightStart=out.eent;out.nightEnd=bm2;out.windows=[];
  if(out.eent&&bm2){
    let up=false,st=0;
    for(let j=out.eent;j<=bm2+1e-9;j+=1/1440){
      const u=moonAlt(j,lat,lon)>moonH0(j);
      if(u&&!up){st=j;up=true}
      if(!u&&up){out.windows.push([st,j]);up=false}
    }
    if(up)out.windows.push([st,bm2]);
  }
  out.dark=[];
  if(out.eent&&bm2){let cur=out.eent;for(const w of out.windows){if(w[0]>cur)out.dark.push([cur,w[0]]);cur=Math.max(cur,w[1])}if(cur<bm2-1e-9)out.dark.push([cur,bm2])}
  out.ph=phaseAt(jd0+1);out.jd0=jd0;out.qd=quarterDay(jd0,tz);
  return out;
}

        const k=x.e.id+"|"+x.n+"|"+r;
        if(S.notified[k]||!hit(x.e,x.n,r))continue;
        new Notification(label(x.e,x.n)+": "+x.e.title,{body:fdn(x.n)+(x.e.time?" "+x.e.time.replace(":","")+" hrs":"")});S.notified[k]=1;
      }
    }
    save();
  }catch(e){}
}
$("langBtn").onclick=()=>{S.lang=S.lang==="en"?"bn":"en";render()};
render();checkNotify();setInterval(()=>{renderAlerts();checkNotify()},60000);
</script>
</body>
