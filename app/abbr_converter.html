<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abbreviation Converter</title>
<style>
:root{--bg:#eef0e6;--card:#fff;--ink:#1f2a1a;--mute:#5d6b52;--line:#c9d0bb;--main:#3f5a2a;--main-ink:#fff;--hl:#fff3a8;--amb:#ffd6a5;--ctx:#c9eec2;--warn:#a33a2a}
@media (prefers-color-scheme:dark){:root{--bg:#161a12;--card:#20271a;--ink:#e8ecdf;--mute:#9aa98c;--line:#3a4530;--main:#7fa65a;--main-ink:#10150c;--hl:#5a5320;--amb:#6b4a1f;--ctx:#2f5a2c;--warn:#e08a78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Noto Sans Bengali",sans-serif;padding:12px 12px 40px;max-width:640px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea{min-height:130px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px}
button.main{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.meta{color:var(--mute);font-size:13px;margin-top:8px}
#res{white-space:pre-wrap;word-break:break-word;min-height:60px}
.chg{background:var(--hl);border-radius:4px;padding:0 2px;cursor:pointer}
.chg.ctx{background:var(--ctx)}
.chg.amb{background:var(--amb);outline:1px dashed var(--warn)}
.hit{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hit b{white-space:nowrap;color:var(--main)}
.toast{color:var(--main);font-weight:600;min-height:22px;margin-top:6px}
.lang{padding:6px 12px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:18px}
</style>
</head>

<header><h1 id="t_title"></h1><button class="lang" id="langBtn"></button></header>
<p class="sub" id="t_sub"></p>

<div class="card">
  <h2 id="t_search"></h2>
  <input id="q" autocomplete="off">
  <div id="hits"></div>
</div>

<div class="card">
  <h2 id="t_input"></h2>
  <textarea id="inp"></textarea>
  <div class="actions">
    <button class="main" id="ab"></button>
    <button class="main" id="de"></button>
    <button id="clr"></button>
  </div>
  <div class="meta" id="meta"></div>
</div>

<div class="card">
  <h2 id="t_result"></h2>
  <div id="res"></div>
  <div class="actions"><button id="copy"></button></div>
  <div class="toast" id="toast"></div>
</div>
<footer id="t_foot"></footer>

 bn:{title:"সংক্ষিপ্ত রূপ কনভার্টার",sub:"JSSDM 2022 (Annex A, B, C) অনুযায়ী। অফলাইনে চলে।",search:"খুঁজুন",ph:"সংক্ষিপ্ত রূপ বা শব্দ লিখুন",input:"ইনপুট টেক্সট",inph:"এখানে টেক্সট লিখুন বা পেস্ট করুন",ab:"সংক্ষিপ্ত করুন",de:"পূর্ণরূপ করুন",clr:"মুছুন",result:"ফলাফল",copy:"ফলাফল কপি করুন",copied:"কপি হয়েছে।",words:"ইনপুট শব্দ",chg:"পরিবর্তন",tip:"হাইলাইট করা শব্দে চাপ দিয়ে পরিবর্তন করুন। সবুজ: বাক্য অনুযায়ী অর্থ বাছা হয়েছে। কমলা: নিশ্চিত নয়, যাচাই করুন।",none:"কিছু পাওয়া যায়নি।",foot:"পাঠানোর আগে গুরুত্বপূর্ণ রিপোর্ট যাচাই করুন।",lang:"English",res0:"রূপান্তরিত টেক্সট এখানে দেখাবে।"}
};
let lang="en";try{lang=localStorage.getItem("abbr_lang")||"en"}catch(e){}
const $=id=>document.getElementById(id), t=k=>TXT[lang][k];

/* ---- build lookup tables ---- */
function sfx(b,s){if(/e$/i.test(b)&&/^[aeiou]/i.test(s))b=b.slice(0,-1);return b+s}
function slashExpand(r){
  if(r.indexOf("/")<0||/\d\/|\/\d/.test(r))return [r];
  var seg=r.split("/").map(function(x){return x.trim()}).filter(Boolean),W=function(x){return x.split(/\s+/).filter(Boolean)};
  if(seg.length===2&&(W(seg[0]).length===1||W(seg[1]).length===1)){
    if(/^[a-z]{1,3}$/.test(seg[1])&&W(seg[0]).length===1)return [seg[0],sfx(seg[0],seg[1])];
    var a=W(seg[0]),b=W(seg[1]),pa=a.slice(0,-1),al=a[a.length-1],bf=b[0],tl=b.slice(1);
    return [pa.concat([al],tl).join(" "),pa.concat([bf],tl).join(" ")];
  }
  return seg;
}
function variants(f){
  var slots=[],s=f.replace(/([^\s()\/]+)((?:\s?\([a-z]{1,8}(?:\/[a-z]{1,8})*\))+)/g,function(m,w,gs){
    var alts=[w];gs.replace(/\(([^)]*)\)/g,function(x,g){g.split("/").forEach(function(sf){alts.push(sfx(w,sf))});return x});
    slots.push(alts);return "\u0001"+(slots.length-1)+"\u0002"});
  var res=[s];
  slots.forEach(function(alts,i){var nx=[];res.forEach(function(r){alts.forEach(function(a){nx.push(r.replace("\u0001"+i+"\u0002",a))})});res=nx});
  var out=[];res.forEach(function(r){slashExpand(r).forEach(function(x){out.push(x.trim())})});
  return Array.from(new Set(out.filter(Boolean)));
}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const fullMap=new Map(), abbrMap=new Map();
for(const [f,a,s] of DATA){
  for(const v of (a.includes("/")?[f]:variants(f))){const k=v.toLowerCase();if(!fullMap.has(k))fullMap.set(k,[]);const l=fullMap.get(k);if(!l.some(x=>x.a===a))l.push({a,s})}
  if(!abbrMap.has(a))abbrMap.set(a,[]);
}
for(const a in MULTI){abbrMap.set(a,MULTI[a].slice());for(const m of MULTI[a])for(const v of (a.includes("/")?[m]:variants(m))){const k=v.toLowerCase();if(!fullMap.has(k))fullMap.set(k,[]);const l=fullMap.get(k);if(!l.some(x=>x.a===a))l.push({a,s:"b"})}}
for(const [f,a] of DATA){const l=abbrMap.get(a);if(!l.some(m=>norm(m)===norm(f)))l.push(f)}
const SEARCH=[];{const seen=new Set();
  const add=(f,a)=>{const k=norm(f)+"|"+a;if(!seen.has(k)){seen.add(k);SEARCH.push([f,a])}};
  for(const [a,l] of abbrMap)for(const m of l)add(m,a);
  for(const [f,a] of DATA)add(f,a);}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
function makeRe(keys,flags){
  keys=[...keys].sort((a,b)=>b.length-a.length);
  return new RegExp("(?<![A-Za-z0-9&])(?:"+keys.map(k=>esc(k).replace(/\s+/g,"\\s+")).join("|")+")(?![A-Za-z0-9&])",flags);
}
const reAb=makeRe(fullMap.keys(),"gi"), reDe=makeRe(abbrMap.keys(),"g");
const he=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---- choose the meaning that fits the sentence ---- */
const ENG=new Set(["met","sit","act","pro","max","min","rest","set","use","per","mid","hit","out","own","get","tie","sat","cut","map","man","bar","tab","fix","log","lab","bus","fit","net","sec","dep","des","div","gen","mar","wit","res","rec","ref","reg"]);
const STOP=new Set(["with","from","that","this","have","been","were","will","their","there","which","unit","area","para"]);
const stems=s=>(s.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,5));
function pick(opts,text,off,len){
  if(opts.length<2)return {opts,state:""};
  const before=text.slice(0,off), after=text.slice(off+len);
  const s0=Math.max(before.lastIndexOf("."),before.lastIndexOf("\n"),before.lastIndexOf("!"),before.lastIndexOf("?"))+1;
  let e=after.search(/[.!?\n]/);e=e<0?after.length:e;
  const sent=new Set(stems(before.slice(s0)+" "+after.slice(0,e)));
  const all=new Set(stems(before+" "+after));
  const sc=opts.map((m,i)=>{let n=0;for(const w of new Set(stems(m))){if(sent.has(w))n+=2;else if(all.has(w))n+=1}return [n,i]});
  sc.sort((x,y)=>y[0]-x[0]||x[1]-y[1]);
  const best=sc[0][0], tie=sc[1][0]===best;
  return {opts:sc.map(x=>opts[x[1]]),state:(best>0&&!tie)?"ctx":"amb"};
}
function convert(text,re,mode){
  let out="",last=0,n=0;
  text.replace(re,(m,off)=>{
    let r;
    if(mode==="ab"){
      const c=fullMap.get(m.replace(/\s+/g," ").toLowerCase());if(!c)return m;
      const up=/^[A-Z]/.test(m);
      const o=[...c].sort((x,y)=>up?((y.s==="c")-(x.s==="c")):((x.s==="c")-(y.s==="c"))).map(x=>x.a);
      r={opts:o,state:o.length>1?"amb":""};
    }else{
      const c=abbrMap.get(m);if(!c)return m;
      r=pick(c,text,off,m.length);if(ENG.has(m)){r={opts:[m,...r.opts],state:"amb"}}
    }
    out+=he(text.slice(last,off));
    const all=[...r.opts,m];
    out+='<span class="chg'+(r.state?" "+r.state:"")+'" data-o="'+he(JSON.stringify(all))+'" data-i="0">'+he(all[0])+'</span>';
    last=off+m.length;n++;return m;
  });
  out+=he(text.slice(last));
  return [out,n];
}
function run(kind){
  const text=$("inp").value;
  const [html,n]=convert(text,kind==="ab"?reAb:reDe,kind);
  $("res").innerHTML=html||'<span style="color:var(--mute)">'+t("res0")+'</span>';
  const w=(text.trim().match(/\S+/g)||[]).length;
  $("meta").textContent=t("words")+": "+w+"  |  "+t("chg")+": "+n+(n?"  |  "+t("tip"):"");
}
$("res").addEventListener("click",e=>{
  const s=e.target.closest(".chg");if(!s)return;
  const o=JSON.parse(s.dataset.o);let i=(+s.dataset.i+1)%o.length;
  s.dataset.i=i;s.textContent=o[i];
});
$("ab").onclick=()=>run("ab");$("de").onclick=()=>run("de");
$("clr").onclick=()=>{$("inp").value="";$("res").innerHTML="";$("meta").textContent=""};
$("copy").onclick=async()=>{
  const txt=$("res").textContent;
  try{await navigator.clipboard.writeText(txt)}catch(e){const r=document.createRange();r.selectNodeContents($("res"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}
  $("toast").textContent=t("copied");setTimeout(()=>$("toast").textContent="",2500);
};
$("q").addEventListener("input",()=>{
  const q=$("q").value.trim().toLowerCase();
  if(!q){$("hits").innerHTML="";return}
  const exact=[],part=[];
  for(const [f,a] of SEARCH){
    const fl=f.toLowerCase(),al=a.toLowerCase();
    if(al===q||fl===q)exact.push([f,a]);else if(al.startsWith(q)||fl.includes(q))part.push([f,a]);
  }
  const r=[...exact,...part].slice(0,40);
  $("hits").innerHTML=r.length?r.map(([f,a])=>'<div class="hit"><span>'+he(f)+'</span><b>'+he(a)+'</b></div>').join(""):'<div class="meta">'+t("none")+'</div>';
});
$("langBtn").onclick=()=>{lang=lang==="en"?"bn":"en";try{localStorage.setItem("abbr_lang",lang)}catch(e){}ui()};
function ui(){
  document.documentElement.lang=lang;
  $("t_title").textContent=t("title");$("t_sub").textContent=t("sub");$("t_search").textContent=t("search");
  $("q").placeholder=t("ph");$("t_input").textContent=t("input");$("inp").placeholder=t("inph");
  $("ab").textContent=t("ab");$("de").textContent=t("de");$("clr").textContent=t("clr");
  $("t_result").textContent=t("result");$("copy").textContent=t("copy");$("t_foot").textContent=t("foot");$("langBtn").textContent=t("lang");
}
ui();
</script>
